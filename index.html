<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Haunted Fish Market</title>
<style>
  :root{box-sizing:border-box;--bg:#0a0614;--ink:#e8d9ff;--wood:#4a3524;--dark:#1c120a;--cream:#ffe9c4;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
  html,body{margin:0;height:100%;height:100dvh;background:var(--bg);color:var(--ink);font-family:"Courier New",monospace;overscroll-behavior:none}
  body{display:flex;flex-direction:column;align-items:center;justify-content:center}
  #wrap{position:relative;width:100vw;height:100dvh;height:100svh}
  #hot{position:absolute;top:8px;left:50%;transform:translateX(-50%);display:none;gap:6px;z-index:3}
  .slot{position:relative;width:44px;height:44px;opacity:.92;background:#5a3b26;border:3px solid #2f1d12;box-shadow:inset 0 3px 0 #7a5236;display:flex;align-items:center;justify-content:center;border-radius:4px;cursor:pointer}
  .slot.on{border-color:#ffe9c4}.slot b{position:absolute;right:2px;bottom:0;font-size:13px;color:#ffe9c4;text-shadow:1px 1px 0 #000}
  #bagb{position:absolute;top:8px;left:calc(50% + 110px);z-index:3;font-size:13px;padding:10px 12px}
  #act{position:absolute;right:16px;bottom:72px;width:76px;height:76px;border-radius:50%;display:none;align-items:center;justify-content:center;z-index:3;background:#8a2f3f;border:3px solid #2f1d12;box-shadow:inset 0 4px 0 #b84a5c,inset 0 -4px 0 #5c1f2a;color:#ffe9c4;font-size:16px;touch-action:none;cursor:pointer}
  #act:active{background:#6e2330}
  #bag{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(88%,460px);max-height:86%;overflow:auto;display:none;flex-direction:column;gap:6px;background:rgba(58,38,24,.97);border:3px solid #2f1d12;box-shadow:inset 0 3px 0 #7a5236;padding:12px;z-index:6;color:#ffe9c4;font-size:14px}
  .ig{display:grid;grid-template-columns:1fr 1fr;gap:5px}.cell{display:flex;align-items:center;gap:6px;background:#47301f;border:2px solid #2f1d12;padding:4px;cursor:pointer}.cell.empty{opacity:.45}
  #bag p{margin:0;min-height:16px;font-size:13px}
  #cw{width:90px;height:10px;border:2px solid #cfe3ff;background:#0b1020;margin:2px 0 0 auto}#cf{height:100%;width:0;background:#b46ee0}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:6px;width:100%}.grid2 button{width:100%;font-size:14px;padding:10px}
  #rot{display:none;position:fixed;top:0;left:0;right:0;text-align:center;padding:6px;background:#2f1d12;color:#ffe9c4;font-size:13px;z-index:9}
  @media (orientation:portrait){#rot{display:block}}
  #stick{position:absolute;left:14px;bottom:14px;width:120px;height:120px;display:none;touch-action:none;z-index:3;background:#5a3b26;border:3px solid #2f1d12;border-radius:10px;box-shadow:inset 0 4px 0 #7a5236,inset 0 -4px 0 #3d2616;opacity:.93}
  #stick::before{content:"";position:absolute;inset:12px;border:2px dashed rgba(255,233,196,.3);border-radius:50%}
  #knob{position:absolute;left:50%;top:50%;width:54px;height:54px;margin:-27px 0 0 -27px;background:#ffd0dc;border:3px solid #2f1d12;border-radius:8px;box-shadow:inset 0 5px 0 #fff0f4,inset 0 -5px 0 #e59ab0,3px 4px 0 #2f1d12}
  #knob::before{content:"";position:absolute;left:11px;top:18px;width:6px;height:7px;background:#2a1b2e;box-shadow:20px 0 0 #2a1b2e}
  #knob::after{content:"";position:absolute;left:6px;top:30px;width:10px;height:5px;background:#ff9aa8;box-shadow:24px 0 0 #ff9aa8}
  canvas#c{width:100%;height:100%;image-rendering:pixelated;touch-action:none;display:block}
  #hud{position:absolute;top:8px;left:10px;font-size:13px;text-shadow:0 1px 0 #000,0 0 6px #000;line-height:1.3;max-width:62%}
  #air{position:absolute;top:10px;right:12px;font-size:14px;text-align:right;display:none;text-shadow:0 1px 0 #000}
  #bw{width:90px;height:14px;border:2px solid #cfe3ff;background:#0b1020;margin-top:2px;margin-left:auto}
  #bf{height:100%;width:100%;background:#5ad1ff}
  #panel{position:absolute;inset:0;z-index:5;display:none;flex-direction:column;align-items:center;gap:10px;text-align:center;padding:16px;overflow-y:auto;color:var(--cream)}
  #panel h1{margin:6px 0 0;font-size:38px;line-height:1.05;letter-spacing:1px;color:var(--cream);text-shadow:0 0 18px #ffb347,3px 3px 0 var(--dark)}
  #panel h2{margin:0;font-size:26px;text-shadow:2px 2px 0 var(--dark)}#panel p{margin:0;font-size:15px}
  #bar{position:absolute;right:10px;bottom:10px;display:flex;gap:6px;z-index:3}
  #bar button{font-size:14px;padding:10px 14px}
  button{font:inherit;font-size:16px;padding:12px 20px;border:3px solid #7fa6d9;background:#17233f;color:var(--ink);border-radius:4px;cursor:pointer}
  button:active{background:#25395f}button:disabled{opacity:.4}
  button.wood{border-color:var(--dark);background:var(--wood);color:var(--cream);box-shadow:inset 0 3px 0 #7a5236,inset 0 -3px 0 #3d2616}
  button.wood:active{background:#47301f}button.sm{padding:10px 12px}
  button.opt.on{background:#9a6a3e;border-color:#ffe9c4}
  #msg{position:absolute;top:64px;left:50%;transform:translateX(-50%);font-size:13px;opacity:.95;max-width:70%;text-align:center;text-shadow:0 1px 0 #000;pointer-events:none}
  .list{flex:1;width:100%;overflow-y:auto;display:flex;flex-direction:column;gap:8px;min-height:0}
  .card{display:flex;justify-content:space-between;align-items:center;gap:6px;background:var(--wood);border:3px solid var(--dark);box-shadow:inset 0 3px 0 #7a5236;padding:10px;text-align:left}
  .card small{opacity:.85}
  .bot{width:100%}.bot button{width:100%}
  .row{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;width:100%}
  .box{width:100%;background:rgba(90,59,38,.85);border:3px solid var(--dark);padding:10px;box-sizing:border-box}
  .keys{font-size:13px;text-align:left;line-height:1.7;margin:8px 0 0}
  #panel>*{max-width:560px}#panel>.two{max-width:680px}.two{display:flex;gap:8px;width:100%;align-items:flex-start;text-align:left}.two>div{flex:1;display:flex;flex-direction:column;gap:8px;min-width:0}
  .sw{width:34px;height:34px;padding:0;border:3px solid var(--dark)}.sw.on{border-color:#fff}
  input{font:inherit;font-size:16px;width:100%;box-sizing:border-box;padding:8px;background:#2a1a10;color:var(--cream);border:3px solid var(--dark)}
</style>
</head>
<body>
<div id="wrap"><canvas id="c" width="640" height="360"></canvas>
<div id="hud"></div>
<div id="air">Air<div id="bw"><div id="bf"></div></div>Curse<div id="cw"><div id="cf"></div></div></div>
<div id="panel"></div>
<div id="hot"></div><button id="bagb" class="wood sm" style="display:none">Bag</button><div id="act" style="display:none">Use</div><div id="bag"></div>
<div id="stick"><div id="knob"></div></div>
<div id="bar"><button id="fs" class="wood sm" title="Full screen">&#9974;</button><button id="zin" class="wood sm" style="display:none" title="Zoom in">+</button><button id="zout" class="wood sm" style="display:none" title="Zoom out">&minus;</button><span id="zooml" class="wood sm" style="display:none;padding:10px 12px;font-size:14px">100%</span><button id="btn" style="display:none"></button><button id="home" class="wood sm" style="display:none">Menu</button></div>
<div id="msg"></div></div>
<div id="rot">Turn your phone sideways for the best view</div>
