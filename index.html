<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Haunted Fish Market</title>
<style>
  :root{box-sizing:border-box;--bg:#0a0614;--ink:#e8d9ff;--wood:#4a3524;--dark:#1c120a;--cream:#ffe9c4;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
  html,body{margin:0;height:100%;height:100dvh;background:var(--bg);color:var(--ink);font-family:"Courier New",monospace;overscroll-behavior:none}
  body{display:flex;flex-direction:column;align-items:center;justify-content:center}
  #wrap{position:relative;width:100vw;height:100dvh;height:100svh}
  #hot{position:absolute;top:8px;left:50%;transform:translateX(-50%);display:none;gap:6px;z-index:3}
  .slot{position:relative;width:52px;height:52px;background:#5a3b26;border:3px solid #2f1d12;box-shadow:inset 0 3px 0 #7a5236;display:flex;align-items:center;justify-content:center;border-radius:4px;cursor:pointer}
  .slot.on{border-color:#ffe9c4}.slot b{position:absolute;right:2px;bottom:0;font-size:13px;color:#ffe9c4;text-shadow:1px 1px 0 #000}
  #bagb{position:absolute;top:8px;left:calc(50% + 110px);z-index:3;font-size:13px;padding:10px 12px}
  #act{position:absolute;right:16px;bottom:72px;width:76px;height:76px;border-radius:50%;display:none;align-items:center;justify-content:center;z-index:3;background:#8a2f3f;border:3px solid #2f1d12;box-shadow:inset 0 4px 0 #b84a5c,inset 0 -4px 0 #5c1f2a;color:#ffe9c4;font-size:16px;touch-action:none;cursor:pointer}
  #act:active{background:#6e2330}
  #bag{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(88%,460px);max-height:86%;overflow:auto;display:none;flex-direction:column;gap:6px;background:rgba(58,38,24,.97);border:3px solid #2f1d12;box-shadow:inset 0 3px 0 #7a5236;padding:12px;z-index:6;color:#ffe9c4;font-size:14px}
  .ig{display:grid;grid-template-columns:1fr 1fr;gap:5px}.cell{display:flex;align-items:center;gap:6px;background:#47301f;border:2px solid #2f1d12;padding:4px;cursor:pointer}.cell.empty{opacity:.45}
  #bag p{margin:0;min-height:16px;font-size:13px}
  #cw{width:90px;height:10px;border:2px solid #cfe3ff;background:#0b1020;margin:2px 0 0 auto}#cf{height:100%;width:0;background:#b46ee0}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:6px;width:100%}.grid2 button{width:100%;font-size:14px;padding:10px}
  #rot{display:none;position:fixed;top:0;left:0;right:0;text-align:center;padding:6px;background:#2f1d12;color:#ffe9c4;font-size:13px;z-index:9}
  @media (orientation:portrait){#rot{display:block}}
  #stick{position:absolute;left:14px;bottom:14px;width:120px;height:120px;display:none;touch-action:none;z-index:3;background:#5a3b26;border:3px solid #2f1d12;border-radius:10px;box-shadow:inset 0 4px 0 #7a5236,inset 0 -4px 0 #3d2616;opacity:.93}
  #stick::before{content:"";position:absolute;inset:12px;border:2px dashed rgba(255,233,196,.3);border-radius:50%}
  #knob{position:absolute;left:50%;top:50%;width:54px;height:54px;margin:-27px 0 0 -27px;background:#ffd0dc;border:3px solid #2f1d12;border-radius:8px;box-shadow:inset 0 5px 0 #fff0f4,inset 0 -5px 0 #e59ab0,3px 4px 0 #2f1d12}
  #knob::before{content:"";position:absolute;left:11px;top:18px;width:6px;height:7px;background:#2a1b2e;box-shadow:20px 0 0 #2a1b2e}
  #knob::after{content:"";position:absolute;left:6px;top:30px;width:10px;height:5px;background:#ff9aa8;box-shadow:24px 0 0 #ff9aa8}
  canvas#c{width:100%;height:100%;image-rendering:pixelated;touch-action:none;display:block}
  #hud{position:absolute;top:10px;left:12px;font-size:16px;text-shadow:0 1px 0 #000,0 0 6px #000;line-height:1.5}
  #air{position:absolute;top:10px;right:12px;font-size:14px;text-align:right;display:none;text-shadow:0 1px 0 #000}
  #bw{width:90px;height:14px;border:2px solid #cfe3ff;background:#0b1020;margin-top:2px;margin-left:auto}
  #bf{height:100%;width:100%;background:#5ad1ff}
  #panel{position:absolute;inset:0;z-index:5;display:none;flex-direction:column;align-items:center;gap:10px;text-align:center;padding:16px;overflow-y:auto;color:var(--cream)}
  #panel h1{margin:6px 0 0;font-size:38px;line-height:1.05;letter-spacing:1px;color:var(--cream);text-shadow:0 0 18px #ffb347,3px 3px 0 var(--dark)}
  #panel h2{margin:0;font-size:26px;text-shadow:2px 2px 0 var(--dark)}#panel p{margin:0;font-size:15px}
  #bar{position:absolute;right:10px;bottom:10px;display:flex;gap:6px;z-index:3}
  #bar button{font-size:14px;padding:10px 14px}
  button{font:inherit;font-size:16px;padding:12px 20px;border:3px solid #7fa6d9;background:#17233f;color:var(--ink);border-radius:4px;cursor:pointer}
  button:active{background:#25395f}button:disabled{opacity:.4}
  button.wood{border-color:var(--dark);background:var(--wood);color:var(--cream);box-shadow:inset 0 3px 0 #7a5236,inset 0 -3px 0 #3d2616}
  button.wood:active{background:#47301f}button.sm{padding:10px 12px}
  button.opt.on{background:#9a6a3e;border-color:#ffe9c4}
  #msg{position:absolute;bottom:64px;left:50%;transform:translateX(-50%);font-size:14px;opacity:.95;max-width:60%;text-align:center;text-shadow:0 1px 0 #000;pointer-events:none}
  .list{flex:1;width:100%;overflow-y:auto;display:flex;flex-direction:column;gap:8px;min-height:0}
  .card{display:flex;justify-content:space-between;align-items:center;gap:6px;background:var(--wood);border:3px solid var(--dark);box-shadow:inset 0 3px 0 #7a5236;padding:10px;text-align:left}
  .card small{opacity:.85}
  .bot{width:100%}.bot button{width:100%}
  .row{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;width:100%}
  .box{width:100%;background:rgba(90,59,38,.85);border:3px solid var(--dark);padding:10px;box-sizing:border-box}
  .keys{font-size:13px;text-align:left;line-height:1.7;margin:8px 0 0}
  #panel>*{max-width:560px}#panel>.two{max-width:680px}.two{display:flex;gap:8px;width:100%;align-items:flex-start;text-align:left}.two>div{flex:1;display:flex;flex-direction:column;gap:8px;min-width:0}
  .sw{width:34px;height:34px;padding:0;border:3px solid var(--dark)}.sw.on{border-color:#fff}
  input{font:inherit;font-size:16px;width:100%;box-sizing:border-box;padding:8px;background:#2a1a10;color:var(--cream);border:3px solid var(--dark)}
</style>
</head>
<body>
<div id="wrap"><canvas id="c" width="640" height="360"></canvas>
<div id="hud"></div>
<div id="air">Air<div id="bw"><div id="bf"></div></div>Curse<div id="cw"><div id="cf"></div></div></div>
<div id="panel"></div>
<div id="hot"></div><button id="bagb" class="wood sm" style="display:none">Bag</button><div id="act" style="display:none">Use</div><div id="bag"></div>
<div id="stick"><div id="knob"></div></div>
<div id="bar"><button id="fs" class="wood sm" title="Full screen">&#9974;</button><button id="zin" class="wood sm" style="display:none" title="Zoom in">+</button><button id="zout" class="wood sm" style="display:none" title="Zoom out">&minus;</button><span id="zooml" class="wood sm" style="display:none;padding:10px 12px;font-size:14px">100%</span><button id="btn" style="display:none"></button><button id="home" class="wood sm" style="display:none">Menu</button></div>
<div id="msg"></div></div>
<div id="rot">Turn your phone sideways for the best view</div>
<script>
const $=id=>document.getElementById(id),cv=$('c');
let g=cv.getContext('2d');
const W=640,H=360,SEA=128;
const SZ=['Small','Medium','Large','Extra large'],WWS=[1280,1680,2200,3200],FLS=[1800,2400,3000,3800];
const DF=['Easy','Normal','Hard','Nightmare'],DRAIN=[.75,1,1.35,1.8],PAT=[1.3,1,.8,.65];
const SKIN=['#f6d6b5','#e8b98a','#b97a50','#7a4a30','#cfe8d0'],HAIR=['#1a1a1a','#8a2f3f','#2f6b4a','#6b4a2f','#e8d6a0'],SUIT=['#7a3a2a','#35507a','#7a355f','#357a5a','#4a4a5a'];
const T=[
 {n:'Minnow',c:'#7fe3d6',l:'#d2fff7',d:'#3da89c',w:12,p:3},
 {n:'Lantern fish',c:'#ffd98a',l:'#fff3c8',d:'#c9953e',w:16,p:8,glow:1},
 {n:'Ghost fish',c:'#c9a6ff',l:'#efe4ff',d:'#8a63c9',w:20,p:25,glow:1}];
const R=(x,y,w,h,c)=>{g.fillStyle=c;g.fillRect(Math.round(x),Math.round(y),w,h)};
function rng(s){return()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const esc=s=>String(s).replace(/[<>&"]/g,'');

let worlds=[],cur=null,delI=-1,cr={},WW=720,FLOOR=1440,drain=1,pat=1,av={skin:0,hair:0,suit:0};
let phase='title',coins=0,day=1,inv=[0,0,0],lung=0,fins=0,t=0;
let px=360,py=SEA-12,breath=25,nightT=70,dayT=30,fish=[],floats=[],bubbles=[],custs=[],ptr=null,cx=0,cy=0,spawnT=0;
let kelp=[],stars=[],corals=[],eyes=[],rays=[],grid=[],cols=0,rows=0,surf=[],chests=[],ruins=[],mode='boat',bx=360;
let order=null;
let vx=0,vy=0,face=1,parts=[],mobs=[],hurt=0,shake=0,bvx=0,wasUnder=false,snap=1;
let hp=3,curse=0,sel=0,atk=null,cd=0,flares=[],hl=0,lastHK='';
let ctrlMode='mobile';
try{ctrlMode=localStorage.getItem('hfm_controls')||'mobile'}catch(e){}
if(ctrlMode!=='desktop')ctrlMode='mobile';
let keys={};
let zoom=1.25;try{zoom=parseFloat(localStorage.getItem('hfm_zoom'))||1.25}catch(e){} if(!(zoom>=.55&&zoom<=1.8))zoom=1;
function setZoom(z){zoom=Math.max(.55,Math.min(1.8,Math.round(z*100)/100));try{localStorage.setItem('hfm_zoom',zoom)}catch(e){} const zl=$('zooml');if(zl)zl.textContent=Math.round(zoom*100)+'%';}
const viewW=()=>W/zoom, viewH=()=>H/zoom;
function setCtrl(m){ctrlMode=m;try{localStorage.setItem('hfm_controls',m)}catch(e){}applyCtrlUI();}
function applyCtrlUI(){const st=$('stick');if(!st)return;st.style.display=(phase==='night'&&ctrlMode==='mobile')?'block':'none';}
const maxB=()=>25+10*lung,spd=()=>1+.25*fins;

try{worlds=JSON.parse(localStorage.getItem('hfm_worlds')||'[]')}catch(e){worlds=[]}
function persist(){
  if(cur){Object.assign(cur,{coins,day,inv:inv.slice(),lung,fins,hl})}
  try{localStorage.setItem('hfm_worlds',JSON.stringify(worlds))}catch(e){}
}
function gen(seed){
  const r=rng(seed);
  cols=Math.ceil(WW/16);rows=Math.ceil((FLOOR+20-SEA)/16);grid=new Uint8Array(cols*rows);
  const pts=Array.from({length:(cols/6|0)+8},()=>r()),sm=u=>u*u*(3-2*u);
  const nz=(c,s)=>{const f=c/6,i=Math.floor(f),u=sm(f-i);return pts[(i+s)%pts.length]*(1-u)+pts[(i+s+1)%pts.length]*u};
  surf=[];
  for(let c=0;c<cols;c++){const n=nz(c,0)*.7+nz(c*2.3,7)*.3;surf.push(rows-3-Math.round(rows*(.06+.5*Math.pow(n,1.6))));for(let q=surf[c];q<rows;q++)grid[q*cols+c]=1}
  const carve=(x,y,rad)=>{for(let q=Math.floor(y-rad);q<=y+rad;q++)for(let c=Math.floor(x-rad);c<=x+rad;c++)if(q>0&&q<rows-3&&c>0&&c<cols-1&&(c-x)**2+(q-y)**2<=rad*rad)grid[q*cols+c]=0};
  chests=[];
  for(let k=0,n=0;k<cols/9&&n<300;n++){
    const c=4+(r()*(cols-8)|0),dir=r()<.5?1:-1,L=7+(r()*5|0),ex=c+dir*.9*L,ey=surf[c]+1+.35*L;
    if(ex<6||ex>cols-6||surf[Math.round(ex)]>ey-6)continue;
    let x=c,y=surf[c]+1;
    for(let s=0;s<L;s++){x+=dir*.9;y+=.35;carve(x,y,1.1)}
    carve(x,y,2.1);chests.push({x:x*16+8,y:SEA+(y+3.5)*16,open:false,v:Math.round(15+y/rows*45)});k++;
  }
  ruins=[];
  for(let k=0;k<cols/14;k++){const c=3+(r()*(cols-8)|0),kind=r()*3|0;ruins.push({x:c*16,y:SEA+surf[c]*16,k:kind});
    if(kind<2){const c2=Math.min(cols-1,c+4);chests.push({x:c2*16+8,y:SEA+surf[c2]*16,open:false,v:Math.round(20+surf[c2]/rows*50)})}}
  const base=x=>SEA+surf[Math.min(cols-1,x/16|0)]*16;
  stars=Array.from({length:WW/6|0},()=>({x:r()*WW,y:r()*124,s:r()*6}));
  kelp=Array.from({length:WW/44|0},()=>{const x=r()*WW;return{x,y:base(x),h:60+r()*110,ph:r()*6}});
  corals=Array.from({length:WW/60|0},()=>{const x=r()*WW;return{x,y:base(x),k:r()*3|0,c:['#8a3f6b','#3f6b8a','#6b3f8a'][r()*3|0]}});
  eyes=[];for(let k=0,n=0;k<WW/110&&n<200;n++){const x=r()*WW,y=SEA+(FLOOR-SEA)*(.45+r()*.5);if(!isSolid(x,y)&&!isSolid(x+18,y)){eyes.push({x,y,ph:r()*9});k++}}
  rays=Array.from({length:WW/90|0},()=>({x:r()*WW,w:12+r()*20}));
}
function isSolid(x,y){const r=Math.floor((y-SEA)/16);if(r<0)return false;if(r>=rows)return true;const c=Math.max(0,Math.min(cols-1,Math.floor(x/16)));return grid[r*cols+c]===1}
const blocked=(x,y)=>isSolid(x,y)||isSolid(x-8,y)||isSolid(x+8,y)||isSolid(x,y-12)||isSolid(x,y+12);
function toggleBoat(){
  if(phase!=='night')return;
  if(mode==='shore'){if(px>380){mode='boat';px=bx;py=SEA-12;vx=vy=0;floats.push({x:px,y:SEA-28,txt:'Set sail!',c:'#ffe27a',t:0})}return}
  if(mode==='swim'&&px<440&&py<SEA+28){mode='shore';px=Math.max(32,Math.min(400,px));py=SEA-50;vx=vy=0;floats.push({x:px,y:SEA-28,txt:'On the dock',c:'#ffe27a',t:0});return}
  if(mode==='boat'){mode='swim';px=bx;py=SEA-16;vy=-3.6;vx=bvx*1.2;floats.push({x:px,y:SEA-28,txt:'splash!',c:'#cfe3ff',t:0})}
  else if(Math.abs(px-bx)<44&&py<SEA+28){mode='boat';py=SEA-12;vx=vy=0;splash(px,SEA,1)}
}
function fishAI(f){
  const ty=f.ty,w=ty.w,dx=f.x+w/2-px,dy=f.y+4-py,d=Math.hypot(dx,dy)||1,sp=f.base=f.base||Math.abs(f.v)||.6,aware=mode==='swim'&&py>SEA+12;
  f.dir=f.dir||Math.sign(f.v)||1;
  let ax=f.dir*sp,ay=Math.sin(f.ph*.6)*.2*sp;
  if(ty===T[0]){let n=0,sx=0,sy=0,sv=0;for(const o of fish)if(o!==f&&o.ty===ty&&Math.abs(o.x-f.x)<90&&Math.abs(o.y-f.y)<70){n++;sx+=o.x;sy+=o.y;sv+=o.v}
    if(n){ax=ax*.5+(sv/n)*.5+(sx/n-f.x)*.008;ay+=(sy/n-f.y)*.024}}
  if(aware){
    if(ty===T[2]){if(d<180){if(d>56){ax=-dx/d*sp*1.1;ay=-dy/d*sp*.9}else{ax=dx/d*sp*2.2;ay=dy/d*sp*1.6}}}
    else if(d<(ty===T[0]?84:48)){ax=dx/d*sp*2.4;ay=dy/d*sp*1.8;if(Math.random()<.12)parts.push({x:f.x+w/2,y:f.y,vx:0,vy:-.4,l:.6,k:'bub'})}
    else if(ty===T[1]&&d<160){ax=-dx/d*sp*.9;ay=-dy/d*sp*.7}
  }
  f.v+=(ax-f.v)*.07;f.vy=(f.vy||0)+(ay-(f.vy||0))*.07;
  f.v=Math.max(-4,Math.min(4,f.v));f.vy=Math.max(-4,Math.min(4,f.vy));
  if(Math.abs(f.v)>.24)f.dir=Math.sign(f.v);
  const nx=f.x+f.v;if(isSolid(nx+(f.v>0?w+4:-4),f.y+4))f.v*=-.6;else f.x=nx;
  const ny=f.y+f.vy;if(isSolid(f.x+w/2,ny+(f.vy>0?14:-4)))f.vy*=-.5;else f.y=ny;
  if(f.y<SEA+20){f.y=SEA+20;f.vy=Math.abs(f.vy)*.5}
  f.ph+=.05+Math.hypot(f.v,f.vy)*.08;
}
const mobN=()=>Math.max(3,Math.round(fishN()/6));
function spawnMob(){
  let x,y,n=0;
  do{y=SEA+(FLOOR-SEA)*(.2+Math.random()*.75);x=Math.random()*WW;n++}while(n<60&&(isSolid(x,y)||isSolid(x+16,y)||Math.hypot(x-px,y-py)<220));
  const dp=(y-SEA)/(FLOOR-SEA);
  const bk=dp>.3&&Math.random()<.55;mobs.push({k:bk?'biter':'jelly',hp:bk?4:2,flash:0,x,y,vx:0,vy:0,ph:Math.random()*6,st:'wander',t:0,dir:1});
}
function updateMobs(){
  hurt=Math.max(0,hurt-1/60);shake=Math.max(0,shake-1);updateAtk();
  for(const f of flares){f.l-=1/60;if(!isSolid(f.x,f.y+8))f.y+=.3;if(Math.random()<.2)parts.push({x:f.x,y:f.y-8,vx:(Math.random()-.5)*.8,vy:-1.2,l:.5,k:'spark',c:'#ffd98a'})}
  flares=flares.filter(f=>f.l>0);
  while(mobs.length<mobN())spawnMob();
  for(const m of mobs){
    m.ph+=.06;if(m.flash>0)m.flash--;const dx=px-m.x,dy=py-m.y,d=Math.hypot(dx,dy)||1,aware=mode==='swim'&&py>SEA+16;
    if(m.k==='jelly'){
      m.vy+=Math.sin(m.ph)>.6?-.1:.024;m.vx+=Math.sin(m.ph*.3+m.x)*.02;m.vx*=.97;m.vy*=.96;
      if(aware&&d<140)m.vx+=dx/d*.024;
    }else{
      if(m.st==='wander'){m.vx+=Math.sin(m.ph*.4)*.02;m.vy+=Math.cos(m.ph*.3)*.012;if(aware&&d<170){m.st='stalk';m.t=0}}
      else if(m.st==='stalk'){m.t++;m.vx+=dx/d*.04;m.vy+=dy/d*.04;if(!aware||d>260)m.st='wander';else if(m.t>70&&d<120){m.st='lunge';m.t=0;m.lx=dx/d;m.ly=dy/d}}
      else if(m.st==='lunge'){m.t++;if(m.t===1){m.vx=m.lx*5.2;m.vy=m.ly*5.2}if(m.t>22){m.st='rest';m.t=0}}
      else{m.t++;m.vx*=.92;m.vy*=.92;if(m.t>50)m.st='wander'}
      const sp=Math.hypot(m.vx,m.vy),mx=m.st==='lunge'?5.6:1.8;if(sp>mx){m.vx*=mx/sp;m.vy*=mx/sp}
      if(Math.abs(m.vx)>.2)m.dir=Math.sign(m.vx);
    }
    for(const f of flares){const fx=m.x-f.x,fy=m.y-f.y,fd=Math.hypot(fx,fy)||1;if(fd<140){m.vx+=fx/fd*.1;m.vy+=fy/fd*.1;if(m.st==='stalk'||m.st==='lunge')m.st='rest'}}
    const nx=m.x+m.vx;if(isSolid(nx,m.y)||nx<8||nx>WW-8)m.vx*=-.5;else m.x=nx;
    const ny=m.y+m.vy;if(isSolid(m.x,ny))m.vy*=-.5;else m.y=ny;
    if(m.y<SEA+28){m.y=SEA+28;m.vy=Math.abs(m.vy)}
    if(hurt<=0&&mode==='swim'&&d<20){
      hp--;breath-=1.5*drain;hurt=1.2;shake=12;vx=dx/d*6;vy=dy/d*6;m.vx=-dx/d*3;m.vy=-dy/d*3;if(m.k==='biter'){m.st='rest';m.t=0}
      floats.push({x:px,y:py-24,txt:'-1 HP',c:'#ff8a8a',t:0});
      for(let i=0;i<10;i++)parts.push({x:px,y:py,vx:(Math.random()-.5)*6,vy:(Math.random()-.5)*6,l:.5,k:'spark',c:'#ff8a8a'});
    }
  }
}
function splash(x,y,p){
  for(let i=0;i<Math.min(14,4+(p*3|0));i++)parts.push({x,y,vx:(Math.random()-.5)*4,vy:-Math.random()*(2+p),l:.9,k:'drop'});
  parts.push({x,y,vx:0,vy:0,l:.8,k:'ring',r:4});
}
function updateParts(){
  for(const q of parts){q.l-=1/60;
    if(q.k==='drop'){q.vy+=.2;q.x+=q.vx;q.y+=q.vy;if(q.y>SEA)q.l=0}
    else if(q.k==='bub'){q.y+=q.vy;q.x+=Math.sin(q.l*12)*.4;if(q.y<SEA)q.l=0}

function updateAtk(){
  if(cd>0)cd--;

  atk.t++;

    const L=ext(atk.t)+12;
    for(const k of[.45,.75,1]){const hx=px+atk.dx*L*k,hy=py-4+atk.dy*L*k;
      for(const m of mobs.slice())if(atk&&!atk.h.includes(m)&&Math.hypot(m.x-hx,m.y-hy)<22){atk.h.push(m);hitMob(m)}
      for(const f of fish.slice())if(Math.hypot(f.x+f.ty.w/2-hx,f.y+4-hy)<20)catchFish(f)}
  }
  if(atk&&atk.t>16)atk=null;
}

  m.hp-=1+hl;m.flash=8;m.vx=atk.dx*4.8+(m.x-px)*.04;m.vy=atk.dy*4.8;if(m.k==='biter'){m.st='rest';m.t=0}

    for(let i=0;i<12;i++)parts.push({x:m.x,y:m.y,vx:(Math.random()-.5)*6,vy:(Math.random()-.5)*6,l:.7,k:'spark',c:jl?'#d58cff':'#9a6ad0'});

}

function sail(){
  phase='night';fish=[];floats=[];bubbles=[];for(let i=0;i<fishN();i++)spawn(true);
  bx=480;mode='shore';px=200;py=SEA-50;order={type:Math.random()<.6?0:1,need:2+day,have:0,done:false};breath=maxB();nightT=70;chests.forEach(c=>c.open=false);snap=1;mobs=[];parts=[];vx=vy=0;bvx=0;hurt=0;shake=0;wasUnder=false;hp=3;curse=0;atk=null;cd=0;flares=[];for(let i=0;i<mobN();i++)spawnMob();$('panel').style.display='none';
  applyCtrlUI();jv={x:0,y:0};nightUI(1);$('btn').style.display='block';$('btn').onclick=toggleBoat;$('btn').disabled=false;$('home').style.display='block';$('air').style.display='block';
  $('msg').textContent=ctrlMode==='desktop'?`On the dock: A/D walk, W/Space jump, E board boat. Tonight: catch ${order.need} ${T[order.type].n}.`:`Walk the dock, then E to board. Tonight: catch ${order.need} ${T[order.type].n}.`;
}
function startDay(){
  phase='day';dayT=30;custs=[];floats=[];spawnT=1;$('air').style.display='none';$('stick').style.display='none';nightUI(0);persist();
  $('btn').style.display='block';$('btn').disabled=false;$('btn').textContent='Close shop';$('btn').onclick=toDusk;
  $('msg').textContent='Tap a customer to sell what they want.';
}
function toDusk(){floats=[];$('btn').style.display='none';dusk()}
function dusk(){
  phase='dusk';persist();hideBar();
  const lc=10+10*lung,fc=10+10*fins,hc=15+15*hl,hf=1+hl,p=$('panel');p.style.paddingRight='';p.style.display='flex';p.style.background='rgba(8,12,30,.9)';p.style.justifyContent='center';
  p.innerHTML=`<h2>Dusk falls</h2><p>Coins: ${coins} · Gel ${inv[3]} · Fangs ${inv[4]} · Relics ${inv[5]}</p><div class="grid2">
  <button class="wood" ${lung>=5||coins<lc?'disabled':''} onclick="buy('l')">Bigger lungs Lv${lung} to ${lung+1}<br>+10s air · ${lung>=5?'MAX':lc+' coins'}</button>
  <button class="wood" ${fins>=5||coins<fc?'disabled':''} onclick="buy('f')">Strong fins Lv${fins} to ${fins+1}<br>faster swim · ${fins>=5?'MAX':fc+' coins'}</button>
  <button class="wood" ${hl>=4||coins<hc||inv[4]<hf?'disabled':''} onclick="buy('h')">Sharper harpoon Lv${hl+1} to ${hl+2}<br>${hl>=4?'MAX':hc+' coins + '+hf+' fangs'}</button>
  <button class="wood" ${coins<8?'disabled':''} onclick="buy('b')">Air bottle<br>8 coins</button>
  <button class="wood" ${inv[3]<1?'disabled':''} onclick="buy('g')">Craft 2 flares<br>1 jelly gel</button>
  <button class="wood" ${inv[5]<1?'disabled':''} onclick="buy('r')">Sell relics<br>+${inv[5]*40} coins</button></div>
  <button class="wood" onclick="sail()">Set sail</button>`;
}
function hideBar(){nightUI(0);$('stick').style.display='none';$('btn').style.display='none';$('air').style.display='none';$('msg').textContent=''}
function buy(k){
  if(k==='l'&&lung<5&&coins>=10+10*lung){coins-=10+10*lung;lung++}
  if(k==='f'&&fins<5&&coins>=10+10*fins){coins-=10+10*fins;fins++}
  if(k==='h'&&hl<4&&coins>=15+15*hl&&inv[4]>=1+hl){coins-=15+15*hl;inv[4]-=1+hl;hl++}
  if(k==='b'&&coins>=8){coins-=8;inv[7]++}
  if(k==='g'&&inv[3]>=1){inv[3]--;inv[6]+=2}
  if(k==='r'&&inv[5]>0){coins+=inv[5]*40;inv[5]=0}
  dusk();
}
function die(){
  phase='dead';hideBar();coins=0;day=1;inv=[0,0,0,0,0,0,1,1];lung=0;fins=0;hl=0;persist();
  const p=$('panel');p.style.paddingRight='';p.style.display='flex';p.style.background='rgba(8,12,30,.9)';p.style.justifyContent='center';
  p.innerHTML=`<h2>You collapsed in the abyss</h2><p>The sea keeps everything.<br>Coins, items and upgrades are lost.</p>
  <button class="wood" onclick="sail()">Dive again</button><button class="wood" onclick="showTitle()">Menu</button>`;
}
